name: Deploy to GitHub Pages

# 只在 main 分支推送时部署；也支持在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送直接取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 只把 index.html 放进站点目录：
      # 应用是自包含的单文件，这样能保证线上产物里不会有任何多余文件
      # （文档、截图、以及万一混进来的外部素材都不会被发布出去）
      - name: 准备站点目录
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          echo "站点文件：" && ls -l _site

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
