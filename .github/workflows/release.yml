name: Release

# 打版本 tag（v1.0.0 / v1.1.0 …）时自动创建 Release，
# 并把应用以「正式版文件名」作为附件传上去。
#
# 为什么要走工作流而不是本机手动传：
#   创建 Release / 上传附件只能用 GitHub API，需要个人凭据；
#   而工作流里的 GITHUB_TOKEN 是仓库自带的，不需要任何人提供 token。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（必须已存在，例如 v1.0.0）"
        required: true

# 创建 Release 与上传附件需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 仓库里的 index.html 保持原名（GitHub Pages 依赖它），
      # 发布附件另存一份正式版文件名。两份内容完全一致。
      - name: 准备正式版附件
        run: |
          set -e
          ASSET="Fretboard Trainer 指板训练器正式版V1.html"
          cp index.html "$ASSET"
          echo "附件：$ASSET"
          ls -l "$ASSET" index.html
          sha256sum index.html "$ASSET"
          cmp index.html "$ASSET" && echo "逐字节一致 ✔"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          ASSET="Fretboard Trainer 指板训练器正式版V1.html"
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=("--notes-file" "$NOTES")
          else
            NOTES_ARG=("--generate-notes")
          fi
          gh release create "$TAG" "$ASSET" \
            --title "$TAG · Fretboard Trainer 指板训练器 正式版 V1" \
            "${NOTES_ARG[@]}"
          echo "---"
          gh release view "$TAG" --json tagName,name,assets
